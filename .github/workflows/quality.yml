name: Learning Record Store Quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: learning-record-store-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate bootstrap contract
        shell: python3 {0}
        run: |
          from pathlib import Path

          required = [
              Path("README.md"),
              Path("AGENTS.md"),
              Path("CLAUDE.md"),
              Path("CHANGELOG.md"),
              Path("docs/ARCHITECTURE.md"),
              Path("docs/DATA_MODEL.md"),
              Path("docs/adr/0001-lrs-authority-boundary.md"),
              Path("docs/doctoring/REFERENCES.md"),
              Path("docs/doctoring/STANDARD_TRACEABILITY.md"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"missing required bootstrap files: {missing}")

          architecture = Path("docs/ARCHITECTURE.md").read_text(encoding="utf-8")
          required_terms = ("xAPI 2.0", "1.0.3", "immutable")
          absent = [term for term in required_terms if term not in architecture]
          if absent:
              raise SystemExit(f"LRS architecture is missing compatibility/authority terms: {absent}")

          agents = Path("AGENTS.md").read_text(encoding="utf-8")
          evidence_terms = ("target_xapi_version", "provenance_reference")
          absent = [term for term in evidence_terms if term not in agents]
          if absent:
              raise SystemExit(f"LRS agent rules are missing compatibility evidence terms: {absent}")

          data_model = Path("docs/DATA_MODEL.md").read_text(encoding="utf-8")
          model_terms = ("`compatibility_artifact`", "SHA-256", "(tenant_id, statement_id)")
          absent = [term for term in model_terms if term not in data_model]
          if absent:
              raise SystemExit(f"LRS data model is missing evidence-integrity terms: {absent}")

          forbidden = ("TODO: replace", "TBD: replace", "PLACEHOLDER_REPLACE")
          for path in required:
              text = path.read_text(encoding="utf-8")
              for marker in forbidden:
                  if marker in text:
                      raise SystemExit(f"unresolved bootstrap marker {marker!r} in {path}")

          print("learning record store bootstrap contract validation passed")
